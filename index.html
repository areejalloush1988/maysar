    {id:'beehive-invoice',name:{ar:'بيهايف — تمويل فواتير',en:'Beehive — Invoice finance'},mark:'BH',country:'ae',products:['invoice','explore'],minMonths:24,minRevenue:8000000,minAmount:500000,maxAmount:2500000,url:'https://www.beehive.ae/funding-options',reviewed:'2026-11-17',partner:false,kind:'lender',description:{ar:'تسهيل مقابل فواتير بين الشركات، وفق شروط الفاتورة والمنشأة.',en:'A facility against B2B invoices, subject to business and invoice review.'}},

  ];
  const statuses = ['review','needs_info','ready','submitted','offer','contract','funded','declined','withdrawn'];
  const allowedTransitions = {
    review:['needs_info','ready','declined','withdrawn'], needs_info:['review','ready','declined','withdrawn'],
    ready:['submitted','needs_info','withdrawn'], submitted:['needs_info','offer','declined','withdrawn'],
    offer:['contract','needs_info','declined','withdrawn'], contract:['funded','needs_info','withdrawn'],
    funded:[],declined:[],withdrawn:[]
  };
  const requiredDocs={working:['license','bank'],invoice:['license','bank','invoice'],purchase:['license','bank','contract'],equipment:['license','bank','quotation'],payroll:['license','bank','payroll'],guarantee:['license','bank','contract'],property:['license','bank','project'],explore:['license','bank']};
  function escapeHtml(value=''){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function finite(value){return (typeof value==='number'||typeof value==='string'&&value.trim()!=='')&&Number.isFinite(Number(value));}
  function validateAssessment(a){
    const errors=[];
    if(!['ae','sa','kw','qa','bh','om'].includes(a.country))errors.push('country');
    if(!products.some(p=>p.id===a.product))errors.push('product');
    if(!['trade','tech','industry','health','hospitality','logistics','property','other'].includes(a.sector))errors.push('sector');
    if(!finite(a.months)||Number(a.months)<0||Number(a.months)>1200)errors.push('months');
    if(!finite(a.revenue)||Number(a.revenue)<0||Number(a.revenue)>1e12)errors.push('revenue');
    if(!finite(a.obligations)||Number(a.obligations)<0||Number(a.obligations)>1e10)errors.push('obligations');
    if(!finite(a.amount)||Number(a.amount)<=0||Number(a.amount)>1e9)errors.push('amount');
    if(!String(a.purpose||'').trim()||String(a.purpose).length>1500)errors.push('purpose');
    return errors;
  }
  function matchLender(a,lender){
    const checks=[];
    const push=(key,result,value)=>checks.push({key,result,value});
    push('country',a.country===lender.country,lender.country);
    push('product',lender.products.includes(a.product),a.product);
    push('months',lender.minMonths==null?null:Number(a.months)>=lender.minMonths,lender.minMonths);
    push('revenue',lender.minRevenue==null?null:Number(a.revenue)>=lender.minRevenue,lender.minRevenue);
    push('amount',lender.minAmount==null&&lender.maxAmount==null?null:(!lender.minAmount||Number(a.amount)>=lender.minAmount)&&(!lender.maxAmount||Number(a.amount)<=lender.maxAmount),[lender.minAmount,lender.maxAmount]);
    const status=checks.some(c=>c.result===false)?'excluded':checks.some(c=>c.result===null)?'review':'potential';
    return {lender,checks,status,known:checks.filter(c=>c.result===true).length};
  }
  function matches(a,providers=lenders){
    if(validateAssessment(a).length)return [];
    return providers.map(l=>matchLender(a,l)).filter(m=>m.status!=='excluded').sort((a,b)=>b.known-a.known||a.lender.id.localeCompare(b.lender.id));
  }
  function completeness(company,docs,product='working'){
    const requirements=requiredDocs[product]||requiredDocs.working;
    const fields=['name','license','contact_name','email','phone'];
    const filled=fields.filter(k=>String(company[k]||'').trim()).length;
    const uploaded=requirements.filter(type=>docs.some(d=>d.type===type&&d.status!=='rejected')).length;
    return {percent:Math.round((filled+uploaded)/(fields.length+requirements.length)*100),filled,uploaded,requirements,missing:requirements.filter(type=>!docs.some(d=>d.type===type&&d.status!=='rejected'))};
  }
  function validateFile(file){
    if(!file||!['application/pdf','image/jpeg','image/png'].includes(file.type))return 'type';
    if(file.size<=0||file.size>10*1024*1024)return 'size';
    if(!/\.(pdf|jpe?g|png)$/i.test(file.name))return 'type';
    return null;
  }
  async function verifyFileSignature(file){
    const b=new Uint8Array(await file.slice(0,8).arrayBuffer());
    if(file.type==='application/pdf')return new TextDecoder().decode(b.slice(0,5))==='%PDF-';
    if(file.type==='image/png')return b[0]===137&&b[1]===80&&b[2]===78&&b[3]===71&&b[4]===13&&b[5]===10&&b[6]===26&&b[7]===10;
    if(file.type==='image/jpeg')return b[0]===255&&b[1]===216&&b[2]===255;
    return false;
  }
  function nextStatus(current,next,note='',reference=''){
    if(!allowedTransitions[current]?.includes(next))throw new Error('invalid_transition');
    if(!note.trim())throw new Error('note_required');
    if(['submitted','funded'].includes(next)&&!reference.trim())throw new Error('reference_required');
    return next;
  }
  function compareOffers(offers){
    return offers.map(o=>{
      const amount=Number(o.amount),months=Number(o.months),payment=Number(o.monthly_payment),fees=Number(o.fees||0);
      if(!Number.isFinite(amount)||amount<=0||!Number.isInteger(months)||months<1||months>360||!Number.isFinite(payment)||payment<=0||!Number.isFinite(fees)||fees<0||fees>=amount)throw new Error('invalid_offer');
      return {...o,amount,months,monthly_payment:payment,fees,net:amount-fees,total:months*payment+fees};
    });
  }
  const currency=country=>({ae:'AED',sa:'SAR',kw:'KWD',qa:'QAR',bh:'BHD',om:'OMR'})[country]||'AED';
  const uid=()=>crypto.randomUUID();
  const reference=id=>'MY-'+id.replace(/-/g,'').slice(0,8).toUpperCase();
  window.MaysarDomain={products,lenders,statuses,allowedTransitions,requiredDocs,escapeHtml,validateAssessment,matchLender,matches,completeness,validateFile,verifyFileSignature,nextStatus,compareOffers,currency,uid,reference};
})();

<script>"use strict";
(() => {
  const KEY='maysar-brokerage-v2',SESSION='maysar-auth-v2';
  const empty=()=>({version:2,user:null,company:{},assessment:{country:'ae',product:'working',sector:'',months:'',revenue:'',obligations:'',amount:'',purpose:'',urgency:'month'},documents:[],applications:[],events:[],messages:[],offers:[],reports:[],consents:[],acceptances:[],language:'ar',demo:false,step:0});
  let state;
  try{state=JSON.parse(localStorage.getItem(KEY));if(state?.version!==2)state=empty();}catch{state=empty();}
  let persistent=true;
  function save(){try{const local=configured&&!state.demo&&state.user?{...empty(),language:state.language}:state;localStorage.setItem(KEY,JSON.stringify(local));}catch{persistent=false;throw new Error('storage_full');}}
  const config=window.MAYSAR_CONFIG||{};
  const configured=Boolean(config.supabaseUrl&&config.supabasePublishableKey);
  let auth;
  try{auth=JSON.parse(sessionStorage.getItem(SESSION)||'null');}catch{auth=null;}
  function keepAuth(value){auth=value;try{if(value)sessionStorage.setItem(SESSION,JSON.stringify(value));else sessionStorage.removeItem(SESSION);}catch{}}
  async function api(path,{method='GET',body,headers={},binary=false,retried=false}={}){
    const requestHeaders={apikey:config.supabasePublishableKey,...(auth?.access_token?{Authorization:'Bearer '+auth.access_token}:{}),...headers};
    if(body!==undefined&&!binary)requestHeaders['Content-Type']='application/json';
    let response;
    try{response=await fetch(config.supabaseUrl.replace(/\/$/,'')+path,{method,headers:requestHeaders,body:body===undefined?undefined:binary?body:JSON.stringify(body)});}catch{throw new Error('network');}
    if(response.status===401&&auth?.refresh_token&&!path.startsWith('/auth/')&&!retried){
      const refreshed=await fetch(config.supabaseUrl+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:config.supabasePublishableKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:auth.refresh_token})});
      if(!refreshed.ok){keepAuth(null);throw new Error('session_expired');}
      keepAuth(await refreshed.json());
      return api(path,{method,body,headers,binary,retried:true});
    }
    if(!response.ok){let error;try{error=await response.json();}catch{}throw new Error(error?.msg||error?.message||error?.error_description||'request_failed');}
    if(response.status===204||response.headers.get('content-length')==='0')return null;
    if(binary)return response.blob();
    const text=await response.text();return text?JSON.parse(text):null;
  }
  async function database(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('storage_unavailable'));const r=indexedDB.open('maysar-documents-v2',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(new Error('storage_unavailable'));});}
  async function blobOperation(kind,key,value){const db=await database();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('files',kind==='get'?'readonly':'readwrite');const os=tx.objectStore('files');const req=kind==='put'?os.put(value,key):kind==='delete'?os.delete(key):os.get(key);let result;req.onsuccess=()=>{result=req.result;};tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(new Error('storage_full'));tx.onabort=()=>reject(new Error('storage_full'));});}finally{db.close();}}
  async function loadRemote(){
    const user=await api('/auth/v1/user');
    const [profiles,companies,applications,documents,messages,offers,events,reports,consents,acceptances,overrides]=await Promise.all([
      api('/rest/v1/profiles?select=*'),api('/rest/v1/companies?select=*'),api('/rest/v1/applications?select=*&order=created_at.desc'),api('/rest/v1/documents?select=*'),api('/rest/v1/messages?select=*&order=created_at.asc'),api('/rest/v1/offers?select=*'),api('/rest/v1/application_events?select=*&order=created_at.asc'),api('/rest/v1/reports?select=*'),api('/rest/v1/consents?select=*'),api('/rest/v1/offer_acceptances?select=*'),api('/rest/v1/directory_overrides?select=*')
    ]);
    const profile=profiles?.find(p=>p.id===user.id);
    state={...empty(),language:state.language,demo:false,user:{id:user.id,email:user.email,name:profile?.display_name||user.email,role:profile?.role||'client'},company:companies?.find(c=>c.user_id===user.id)?.data||{},applications:applications||[],documents:documents||[],messages:messages||[],offers:offers||[],events:events||[],reports:reports||[],consents:consents||[],acceptances:acceptances||[],companies:companies||[]};
    state.provider_overrides=(overrides||[]).map(x=>({id:x.id,...x.criteria}));
    const own=companies?.find(c=>c.user_id===user.id);if(own){state.company.id=own.id;state.assessment=own.assessment||empty().assessment;}
    return state;
  }
  async function init(){if(configured&&auth){try{return await loadRemote();}catch(e){if(e.message==='session_expired')state.user=null;throw e;}}return state;}
  function demo(){
    if(!state.demo){const {language,assessment,step}=state;state=empty();state.language=language;state.assessment=assessment;state.step=step;state.demo=true;}
    state.user={id:'demo-client',name:state.language==='ar'?'مساحة العميل التجريبية':'Demo client workspace',email:'demo@example.com',role:'client'};save();
    return state;
  }
  async function signUp(email,password,name){if(!configured)throw new Error('not_configured');const response=await api('/auth/v1/signup',{method:'POST',body:{email,password,data:{display_name:name}}});if(response.access_token){keepAuth(response);await loadRemote();}return response;}
  async function signIn(email,password){if(!configured)throw new Error('not_configured');keepAuth(await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}}));return loadRemote();}
  async function signOut(){if(configured&&auth){try{await api('/auth/v1/logout',{method:'POST'});}catch{}}keepAuth(null);if(state.demo){state.user=null;save();}else{const language=state.language;state=empty();state.language=language;save();}return state;}
  async function recover(email){if(!configured)throw new Error('not_configured');return api('/auth/v1/recover',{method:'POST',body:{email}});}
  async function updateCompany(data){
    if(state.demo){state.company={...state.company,...data};save();return;}
    const rows=await api('/rest/v1/companies?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:{user_id:state.user.id,data,assessment:state.assessment}});
    state.company={...data,id:rows[0].id};
  }
  async function saveAssessment(){if(state.demo||!state.user){save();return;}await updateCompany(state.company);}
  async function addDocument(file,type){
    const id=crypto.randomUUID();
    const doc={id,user_id:state.user.id,type,name:file.name,mime:file.type,size:file.size,status:'uploaded',created_at:new Date().toISOString()};

    else{
      const ext={ 'application/pdf':'pdf','image/jpeg':'jpg','image/png':'png' }[file.type];doc.object_path=state.user.id+'/'+id+'.'+ext;
      await api('/storage/v1/object/maysar-documents/'+doc.object_path,{method:'POST',binary:true,headers:{'Content-Type':file.type},body:file});
      try{const result=await api('/rest/v1/documents',{method:'POST',headers:{Prefer:'return=representation'},body:doc});state.documents.push(result[0]);}catch(e){try{await api('/storage/v1/object/maysar-documents',{method:'DELETE',body:{prefixes:[doc.object_path]}});}catch{}throw e;}

  async function getDocument(doc){if(state.demo)return blobOperation('get',doc.id);return api('/storage/v1/object/authenticated/maysar-documents/'+doc.object_path,{binary:true});}
  async function deleteDocument(id){const doc=state.documents.find(d=>d.id===id);if(!doc)return;if(state.demo){await blobOperation('delete',id);state.documents=state.documents.filter(d=>d.id!==id);save();}else{await api('/storage/v1/object/maysar-documents',{method:'DELETE',body:{prefixes:[doc.object_path]}});await api('/rest/v1/documents?id=eq.'+encodeURIComponent(id),{method:'DELETE'});state.documents=state.documents.filter(d=>d.id!==id);}}
  async function submit(lenderIds,consent){
    if(!consent)throw new Error('consent_required');

    if(state.demo){
      const id=crypto.randomUUID(),now=new Date().toISOString();const application={id,user_id:state.user.id,product:state.assessment.product,amount:Number(state.assessment.amount),country:state.assessment.country,currency:MaysarDomain.currency(state.assessment.country),answers:{...state.assessment},company_snapshot:{...state.company},lender_ids:[...lenderIds],status:'review',created_at:now,updated_at:now};

  async function addMessage(applicationId,body,role='client'){
    const m={id:crypto.randomUUID(),application_id:applicationId,user_id:state.user.id,body,sender_role:state.demo?role:state.user.role,created_at:new Date().toISOString()};
    if(state.demo){state.messages.push(m);save();return m;}

  }
  async function updateStatus(id,status,note,reference){
    const app=state.applications.find(a=>a.id===id);MaysarDomain.nextStatus(app.status,status,note,reference);
    if(status==='submitted'&&!app.lender_ids.length)throw new Error('selected_provider_consent_required');
    if(status==='offer'&&!state.offers.some(o=>o.application_id===id))throw new Error('offer_required');
    if(status==='contract'&&!state.acceptances.some(o=>o.application_id===id))throw new Error('offer_selection_required');

  }
  async function addOffer(data){
    MaysarDomain.compareOffers([data]);

    const rows=await api('/rest/v1/offers',{method:'POST',headers:{Prefer:'return=representation'},body:o});state.offers.push(rows[0]);return rows[0];
  }
  async function acceptOffer(offer){
    if(state.acceptances.some(x=>x.application_id===offer.application_id))throw new Error('already_accepted');
    if(!state.applications.some(a=>a.id===offer.application_id&&['offer','contract'].includes(a.status))||offer.valid_until&&new Date(offer.valid_until+'T23:59:59+04:00')<new Date())throw new Error('invalid_offer_selection');
    const acceptance={id:crypto.randomUUID(),application_id:offer.application_id,offer_id:offer.id,user_id:state.user.id,created_at:new Date().toISOString()};
    if(state.demo){state.acceptances.push(acceptance);save();}else{await api('/rest/v1/offer_acceptances',{method:'POST',body:acceptance});state.acceptances.push(acceptance);}
  }
  async function createReport(providerList=MaysarDomain.lenders){
    const report={id:crypto.randomUUID(),user_id:state.user.id,created_at:new Date().toISOString(),data:{company:{...state.company},answers:{...state.assessment},documents:state.documents.map(({type,status})=>({type,status})),lender_ids:MaysarDomain.matches(state.assessment,providerList).map(m=>m.lender.id),providers_snapshot:JSON.parse(JSON.stringify(providerList)),kind:'preliminary',payment_status:'not_charged'}};
    if(state.demo){state.reports.unshift(report);save();}else{await api('/rest/v1/reports',{method:'POST',body:report});state.reports.unshift(report);}return report;
  }
  async function reset(){for(const d of state.documents)if(state.demo){try{await blobOperation('delete',d.id);}catch{}}const language=state.language;state=empty();state.language=language;save();keepAuth(null);return state;}
  async function saveProvider(override){if(state.demo){state.provider_overrides=[...(state.provider_overrides||[]).filter(o=>o.id!==override.id),override];save();}else{const {id,...criteria}=override;await api('/rest/v1/directory_overrides?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:{id,criteria,updated_by:state.user.id}});state.provider_overrides=[...(state.provider_overrides||[]).filter(o=>o.id!==id),override];}}
  window.MaysarStore={get state(){return state;},get persistent(){return persistent;},configured,save,init,demo,signUp,signIn,signOut,recover,updateCompany,saveAssessment,addDocument,getDocument,deleteDocument,submit,addMessage,updateStatus,addOffer,acceptOffer,createReport,saveProvider,reset,refresh:loadRemote};
})();

function encodeReportPdf(pages, width, height, language = "ar") {
  const encoder = new TextEncoder();
  const chunks = [];
  const offsets = [0];
  let position = 0;
  const text = (value) => bytes(encoder.encode(value));

  function bytes(value) {
    chunks.push(value);
    position += value.length;
  }

  function start(id) {
    offsets[id] = position;
    text(id + " 0 obj\n");
  }

  function object(id, body) {
    start(id);
    text(body + "\nendobj\n");
  }

  function stream(id, dictionary, value) {
    start(id);
    text("<< " + dictionary + " /Length " + value.length + " >>\nstream\n");
    bytes(value);
    text("\nendstream\nendobj\n");
  }

  const pageIds = [];
  const catalog = 1;
  const root = 2;
  let next = 3;
  text("%PDF-1.4\n");
  bytes(Uint8Array.from([37, 226, 227, 207, 211, 10]));
  object(catalog, "<< /Type /Catalog /Pages 2 0 R /Lang (" + (language === "en" ? "en-AE" : "ar-AE") + ") >>");
  for (const page of pages) {
    const id = next++;
    const imageId = next++;
    const contentsId = next++;
    const annots = page.links.map(() => next++);
    const annotationList = annots.map((annotation) => annotation + " 0 R").join(" ");
    pageIds.push(id + " 0 R");
    object(id, "<< /Type /Page /Parent " + root + " 0 R /MediaBox [0 0 " + width + " " + height +
      "] /Resources << /XObject << /Im0 " + imageId + " 0 R >> >> /Contents " + contentsId +
      " 0 R /Annots [" + annotationList + "] >>");
    stream(imageId, "/Type /XObject /Subtype /Image /Width " + page.width + " /Height " + page.height +
      " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode", page.image);
    stream(contentsId, "", encoder.encode("q\n" + width + " 0 0 " + height + " 0 0 cm\n/Im0 Do\nQ\n"));
    for (const [index, link] of page.links.entries()) {
      const uri = link.url.replace(/[()\\]/g, "\\$&");
      const rect = [link.x, height - link.y - link.h, link.x + link.w, height - link.y].join(" ");
      object(annots[index], "<< /Type /Annot /Subtype /Link /Border [0 0 0] /Rect [" + rect +
        "] /A << /S /URI /URI (" + uri + ") >> >>");
    }
  }
  object(root, "<< /Type /Pages /Count " + pages.length + " /Kids [" + pageIds.join(" ") + "] >>");
  const xref = position;
  text("xref\n0 " + next + "\n0000000000 65535 f \n");
  for (let index = 1; index < next; index++) text(String(offsets[index]).padStart(10, "0") + " 00000 n \n");
  text("trailer\n<< /Size " + next + " /Root " + catalog + " 0 R >>\nstartxref\n" + xref + "\n%%EOF\n");
  return new Blob(chunks, { type: "application/pdf" });
}

  function stat(label,value,copy,symbol,tone=''){return `<div class="stat"><div class="stat-head">${label}${tile(symbol,tone)}</div><strong>${value}</strong><small>${copy}</small></div>`;}
  function requestCard(a,admin=false){const ownOffers=S.state.offers.filter(o=>o.application_id===a.id).length;return `<article class="request-card"><div class="request-head"><div><small class="muted"><bdi>${D.reference(a.id)}</bdi></small><h3>${productName(a.product)}</h3></div>${pill(statusName(a.status),statusTone(a.status),true)}</div><div class="request-meta"><span>${icon('wallet')} ${money(a.amount,a.currency)}</span><span>${pair(countries[a.country])}</span><span>${date(a.created_at)}</span>${ownOffers?`<span>${number(ownOffers)} ${t('عرض','offer(s)')}</span>`:''}</div><div class="request-foot"><small>${e(a.company_snapshot?.name||t('ملف الشركة','Company profile'))}</small>${link(t('عرض التفاصيل','View details'),'#'+(admin?'admin-case':'request')+'/'+a.id,'outline small','arrow')}</div></article>`;}
  function dashboardPage(){const s=S.state,c=completion(),open=s.applications.filter(a=>!['funded','declined','withdrawn'].includes(a.status)).length;return `${title(t('أهلًا بك في ميسر','Welcome to Maysar'),t('مساحة واحدة لملف شركتك وخيارات تمويلها.','One place for your company profile and funding journey.'))}<section class="hero-panel"><div class="hero-copy"><div class="eyebrow">${icon('sparkle')}${t('خطوتك القادمة تبدأ هنا','YOUR NEXT STEP STARTS HERE')}</div><h2>${s.company.name?e(s.company.name):t('فرص أوضح تبدأ بملف مرتب.','Clearer opportunities start with a prepared profile.')}</h2><p>${t('جهّز معلوماتك الأساسية، استكشف الجهات المحتملة، وتابع طلبك خطوة بخطوة.','Prepare your business information, explore potential providers and follow your application step by step.')}</p><div class="actions">${link(t('ابدأ تقييمًا جديدًا','Start an assessment'),'#assessment','gold','plus')}${link(t('استكمل ملف الشركة','Complete your profile'),'#company','outline')}</div></div><div class="hero-ring" style="--p:${c.percent}"><div><strong><bdi>${c.percent}%</bdi></strong><small>${t('اكتمال الملف','PROFILE COMPLETENESS')}</small></div></div></section><div class="stats">${stat(t('الطلبات المفتوحة','Open applications'),number(open),t('من طلباتك المسجلة','From your saved applications'),'briefcase','blue')}${stat(t('تقاريرك','Your reports'),number(s.reports.length),t('تقارير أولية محفوظة','Saved preliminary reports'),'file')}${stat(t('المستندات','Documents'),number(s.documents.length),t('مستندات أضفتها لملفك','Documents in your profile'),'folder','green')}${stat(t('عروض التمويل','Financing offers'),number(s.offers.length),t('العروض الواردة لطلباتك','Offers attached to your applications'),'layers','blue')}</div><div class="dashboard-columns"><section class="panel">${panelHead(t('آخر طلباتك','Recent applications'),t('آخر حالة وخطوتك التالية، بوضوح.','Your latest status and next step.'),link(t('جميع الطلبات','View all'),'#requests','soft small'))}${s.applications.length?s.applications.slice(0,2).map(a=>requestCard(a)).join(''):empty(t('أول طلب يبدأ من هنا','Your first application starts here'),t('أكمل التقييم، ثم اطلب مراجعة ملفك من فريق الوساطة.','Complete an assessment, then request a review from the brokerage team.'),link(t('ابدأ التقييم','Start assessment'),'#assessment','primary small'),'briefcase')}</section><section class="panel">${panelHead(t('جهّز ملفك بخطوات بسيطة','Prepare your profile'),t('التقدم يعتمد على البيانات والمستندات المضافة.','Progress reflects your saved information and documents.'))}<div class="progress-line"><span style="width:${c.percent}%"></span></div>${[[Boolean(s.company.name),t('بيانات الشركة','Company details'),t('الاسم والنشاط والرخصة','Name, activity and licence'),'company'],[c.uploaded===c.requirements.length,t('المستندات الأساسية','Required documents'),t('أضف المستندات المناسبة لاحتياجك','Add documents for your funding need'),'documents'],[D.validateAssessment(s.assessment).length===0,t('التقييم الأولي','Initial assessment'),t('عرّف احتياجك ومعلومات النشاط','Describe your business and needs'),'assessment']].map(([done,name,desc,href])=>`<div class="todo-row"><span class="check-round ${done?'done':''}">${icon(done?'check':'plus')}</span><div><strong>${name}</strong><small>${desc}</small></div><a class="text-button" href="#${href}">${done?t('عرض','View'):t('أكمل','Complete')}</a></div>`).join('')}${s.demo?button(t('املأ مثالًا للتجربة','Fill sample details'),'sample-profile','soft small','', 'sparkle'):''}</section></div><section style="margin-top:26px"><div class="section-title"><div><h2>${t('حلول تناسب احتياجات مختلفة','Different needs, different routes')}</h2><p>${t('ابدأ بنوع التمويل الأقرب لخطتك.','Start with a funding purpose.')}</p></div>${link(t('دليل الجهات','Provider directory'),'#directory','outline small','corner')}</div><div class="compact-products">${productCards(true)}</div></section>`;}
  const wizardLabels=()=>[t('الاحتياج','Need'),t('النشاط','Business'),t('الإيرادات','Revenue'),t('الالتزامات','Obligations'),t('المبلغ','Amount'),t('التوقيت','Timing'),t('المراجعة','Review')];
  function assessmentPage(){const a=S.state.assessment,step=Math.max(0,Math.min(6,S.state.step||0));let content='',name='',copy='';
    if(step===0){name=t('شو تحتاج شركتك؟','What does your business need?');copy=t('اختر الغرض الأقرب لاحتياجك. تقدر تغيّره لاحقًا.','Choose the purpose closest to your needs. You can change it later.');content=`<div class="choice-grid">${D.products.map(p=>`<button type="button" class="choice ${a.product===p.id?'selected':''}" data-action="choose-product" data-product="${p.id}" aria-pressed="${a.product===p.id}">${tile(p.icon)}<span><strong>${t(p.ar,p.en)}</strong></span>${a.product===p.id?icon('check'):''}</button>`).join('')}</div>`;}
    if(step===1){name=t('عرّفنا بنشاط شركتك','Tell us about your business');copy=t('تختلف الجهات والشروط حسب الدولة وطبيعة النشاط.','Providers and criteria vary by market and industry.');content=`<div class="field-grid"><label>${t('دولة تسجيل الشركة','Country of registration')}<select data-answer="country">${options(countries,a.country)}</select></label><label>${t('النشاط الرئيسي','Primary activity')}<select data-answer="sector">${options(sectors,a.sector,true)}</select></label></div>`;}
    if(step===2){name=t('عمر النشاط وحجم أعمالك','Business age and revenue');copy=t('استخدم أرقامًا تقريبية الآن، ويمكن مراجعتها مع المستندات.','Use estimates for now. They can be reviewed against your documents.');content=`<div class="field-grid"><label>${t('مدة ممارسة النشاط بالشهور','Months in business')}<input data-answer="months" type="number" min="0" max="1200" value="${e(a.months)}" placeholder="${t('مثال: ٣٦','e.g. 36')}"><small>${t('من بداية التشغيل الفعلي','Since actual trading began')}</small></label><label>${t('الإيراد السنوي التقريبي','Estimated annual revenue')}<input data-answer="revenue" type="number" min="0" max="1000000000000" value="${e(a.revenue)}" placeholder="0"><small>${MaysarDomain.currency(a.country)} · ${t('إيرادات سنة كاملة','Full-year revenue')}</small></label></div>`;}
    if(step===3){name=t('ما التزامات الشركة الحالية؟','What are your current obligations?');copy=t('هذا يساعد على فهم احتياج الشركة. أدخل صفرًا إذا لا توجد التزامات تمويل شهرية.','This helps describe your funding needs. Enter zero if there are no monthly financing obligations.');content=`<label>${t('الأقساط والالتزامات التمويلية الشهرية','Monthly financing repayments')}<input data-answer="obligations" type="number" min="0" max="10000000000" value="${e(a.obligations)}" placeholder="0"><small>${MaysarDomain.currency(a.country)} · ${t('أقساط تمويل قائمة، دون مصروفات التشغيل','Existing financing repayments, excluding operating expenses')}</small></label>${notice(t('تقدير القدرة على السداد يحتاج مراجعة التدفقات النقدية والمستندات لدى الجهة الممولة.','Repayment capacity requires a provider’s review of cash flow and supporting documents.'),'blue')}`;}
    if(step===4){name=t('كم تحتاج، ولأي غرض؟','How much do you need, and why?');copy=t('وصف واضح لاستخدام التمويل يساعد على تجهيز الطلب.','A clear use of funds helps prepare your application.');content=`<div class="field-grid"><label class="span-2">${t('المبلغ المطلوب','Requested amount')}<input data-answer="amount" type="number" min="1" max="1000000000" value="${e(a.amount)}" placeholder="${t('مثال: ٣٠٠٬٠٠٠','e.g. 300000')}"><small>${MaysarDomain.currency(a.country)}</small></label><label class="span-2">${t('كيف ستستخدم التمويل؟','How will the funds be used?')}<textarea data-answer="purpose" maxlength="1500" placeholder="${t('مثل: شراء مخزون لتنفيذ عقد جديد…','e.g. Purchasing inventory for a new contract…')}">${e(a.purpose)}</textarea></label></div>`;}
    if(step===5){name=t('متى تحتاج التمويل؟','When do you need funding?');copy=t('يساعدنا التوقيت على ترتيب أولويات المراجعة، ولا يُعد وعدًا بموعد صرف.','Timing helps prioritise review; it is not a disbursement promise.');content=`<div class="choice-grid">${Object.entries(urgency).map(([id,p])=>`<button type="button" class="choice ${a.urgency===id?'selected':''}" data-action="urgency" data-value="${id}">${icon('calendar')}<strong>${pair(p)}</strong></button>`).join('')}</div>`;}
    if(step===6){name=t('راجع معلوماتك قبل المتابعة','Review before continuing');copy=t('يمكن تعديل أي إجابة بالرجوع للخطوة السابقة.','You can go back to edit any answer.');content=`${assessmentSummary(a)}<label class="consent"><input id="assessment-confirm" type="checkbox" ${a.confirmed?'checked':''}>${t('أؤكد أن البيانات المدخلة تعكس المعلومات المتاحة لدي، وأفهم أن النتيجة أولية.','I confirm the information reflects what I know and understand that this is a preliminary assessment.')}</label>`;}
    return `${title(t('التقييم الأولي','Initial assessment'),t('خطوات قصيرة، ومعلومات تُحفظ لتكمل من حيث توقفت.','Short steps. Save your progress and pick up where you left off.'))}<div class="wizard-wrap"><div class="wizard-stepbar">${wizardLabels().map((name,i)=>`<div class="wizard-step ${i===step?'active':i<step?'done':''}" aria-current="${i===step?'step':'false'}"><span>${i<step?'✓':i+1}</span><small>${name}</small></div>`).join('')}</div><section class="panel wizard-panel"><div class="wizard-label">${t('الخطوة','STEP')} ${step+1} ${t('من','OF')} 7</div><h2>${name}</h2><p class="muted">${copy}</p><div id="wizard-fields" class="stack">${content}</div><div id="wizard-error" role="alert"></div><div class="wizard-footer">${button(step?t('السابق','Back'):t('العودة','Back'),step?'wizard-back':'go-dashboard','outline')}${button(step===6?t('اعرض النتيجة الأولية','View preliminary results'):t('التالي','Continue'),step===6?'wizard-finish':'wizard-next','primary','', 'arrow')}</div></section><p class="form-note" style="text-align:center;margin-top:16px">${icon('folder')} ${t('البيانات المحفوظة تخص ملفك. يمكنك تعديلها قبل تقديم الطلب.','Your saved information can be edited before submitting an application.')}</p></div>`;
  }
  function assessmentSummary(a){return [[t('نوع التمويل','Funding purpose'),productName(a.product)],[t('الدولة والنشاط','Market & industry'),pair(countries[a.country])+' · '+pair(sectors[a.sector])],[t('عمر النشاط','Business age'),number(a.months)+' '+t('شهر','months')],[t('الإيراد السنوي','Annual revenue'),money(a.revenue,MaysarDomain.currency(a.country))],[t('الالتزامات الشهرية','Monthly obligations'),money(a.obligations,MaysarDomain.currency(a.country))],[t('المبلغ المطلوب','Requested amount'),money(a.amount,MaysarDomain.currency(a.country))],[t('الغرض','Use of funds'),e(a.purpose)],[t('التوقيت','Timing'),pair(urgency[a.urgency])]].map(([k,v])=>`<div class="summary-row"><span>${k}</span><strong>${v}</strong></div>`).join('');}
  function companyPage(){const c=S.state.company;return `${title(t('ملف الشركة','Company profile'),t('عرّف بشركتك مرة واحدة، واستخدم ملفك لطلباتك القادمة.','Create one company profile for your future applications.'))}<div class="documents-layout"><form class="panel" id="company-form">${panelHead(t('المعلومات الأساسية','Business information'),t('يمكن مراجعة المستندات وتأكيد البيانات ضمن دراسة الطلب.','Details can be checked against documents during application review.'))}<div class="field-grid">${field(t('اسم الشركة','Company name'),'name',c.name,'text','required maxlength="160" autocomplete="organization"')}${field(t('رقم الرخصة أو السجل التجاري','Licence / registration number'),'license',c.license,'text','required maxlength="80"')}<label>${t('دولة التسجيل','Country of registration')}<select name="country">${options(countries,c.country||S.state.assessment.country)}</select></label><label>${t('النشاط الرئيسي','Primary activity')}<select name="sector" required>${options(sectors,c.sector||S.state.assessment.sector,true)}</select></label>${field(t('اسم المفوّض بالتقديم','Authorised contact'),'contact_name',c.contact_name,'text','required maxlength="100" autocomplete="name"')}${field(t('البريد الإلكتروني','Email address'),'email',c.email|| (S.state.demo?'':S.state.user?.email),'email','required maxlength="180" autocomplete="email" dir="ltr"')}${field(t('رقم الهاتف','Phone number'),'phone',c.phone,'tel','required maxlength="30" autocomplete="tel" dir="ltr"')}${field(t('تاريخ انتهاء الرخصة','Licence expiry'),'license_expiry',c.license_expiry,'date')}<label class="span-2">${t('نبذة عن الشركة','Business summary')}<textarea name="summary" maxlength="2000">${e(c.summary||'')}</textarea></label></div><div class="form-actions"><button class="button primary" type="submit">${icon('check')}${t('احفظ ملف الشركة','Save company profile')}</button></div><div id="company-error" role="alert"></div></form><div class="stack"><section class="panel">${panelHead(t('اكتمال الملف','Profile completeness'))}<div class="hero-ring" style="--p:${completion().percent};margin:15px auto 22px"><div><strong>${completion().percent}%</strong><small>${t('بيانات ومستندات','DETAILS & DOCUMENTS')}</small></div></div><p class="muted" style="font-size:11px;text-align:center">${t('هذه النسبة لا تقيس احتمالية الموافقة على التمويل.','This percentage does not measure the likelihood of financing approval.')}</p></section>${notice(t('تأكيد الهوية وصلاحية التفويض يتم وفق متطلبات الجهة الممولة عند التقديم.','Identity and signing authority are checked according to the provider’s requirements.'),'blue')}${link(t('انتقل للمستندات','Go to documents'),'#documents','outline','folder')}</div></div>`;}
  function documentsPage(){const s=S.state,c=completion();return `${title(t('مستندات الشركة','Company documents'),t('ملف منظم، ونواقص واضحة قبل التقديم.','A prepared file, with missing items clearly identified.'))}<div class="documents-layout"><div class="stack"><section class="panel">${panelHead(t('أضف مستندًا','Add a document'),t('PDF أو صورة JPG / PNG، حتى ١٠ ميغابايت للملف.','PDF, JPG or PNG. Maximum 10 MB per file.'))}<label style="margin-bottom:16px">${t('نوع المستند','Document type')}<select id="document-type">${options(docNames,'license')}</select></label><label class="upload-zone" id="upload-zone" tabindex="0">${tile('folder')}<strong>${t('اضغط لاختيار ملف، أو اسحبه إلى هنا','Choose a file or drag it here')}</strong><p>${t('نحتفظ باسم المستند وحالته لتسهيل المراجعة.','Document names and review status stay in your profile.')}</p><input id="file-input" type="file" accept="application/pdf,image/jpeg,image/png" multiple></label><div id="upload-status" role="status"></div></section><section class="panel">${panelHead(t('ملفاتك المضافة','Your uploaded files'),number(s.documents.length)+' '+t('مستند','document(s)'))}${s.documents.length?s.documents.map(d=>`<div class="document-row">${tile('file','blue')}<div class="doc-name"><strong>${e(d.name)}</strong><small>${pair(docNames[d.type])} · ${(Number(d.size)/1024/1024).toFixed(2)} MB · ${date(d.created_at)}</small></div>${pill(d.status==='verified'?t('تمت المراجعة','Reviewed'):d.status==='rejected'?t('يحتاج تعديلًا','Needs changes'):t('مرفوع — لم يُراجع','Uploaded — not reviewed'),d.status==='verified'?'green':d.status==='rejected'?'red':'blue')}<div class="actions"><button class="icon-button" data-action="open-document" data-id="${e(d.id)}" aria-label="${t('افتح','Open')} ${e(d.name)}">${icon('corner')}</button><button class="icon-button" data-action="delete-document" data-id="${e(d.id)}" aria-label="${t('احذف','Delete')} ${e(d.name)}">${icon('close')}</button></div></div>`).join(''):empty(t('ملفك بانتظار أول مستند','Your first document goes here'),t('اختر نوع المستند، ثم ارفع الملف المناسب.','Choose a document type, then upload the file.'))}</section></div><section class="panel" style="align-self:start">${panelHead(t('المطلوب لهذا المسار','Documents for this route'),productName(s.assessment.product))}<div class="checklist">${c.requirements.map(type=>{const done=s.documents.some(d=>d.type===type&&d.status!=='rejected');return `<div class="checklist-item ${done?'pass':'unknown'}">${icon(done?'check':'folder')}<span><strong>${pair(docNames[type])}</strong><br><small class="muted">${done?t('أُضيف للملف، وتبقى مراجعة المحتوى.','Added; content still needs review.'):t('لم يُضف بعد','Not added yet')}</small></span></div>`;}).join('')}</div><p class="readonly-note">${t('هذه قائمة تجهيز أولية. قد يطلب الممول مستندات إضافية بحسب ملف الشركة.','This is an initial preparation checklist. Providers may request additional documents.')}</p></section></div>`;}
  function lenderCard(l,match=null,selectable=false){return `<article class="lender-card"><div class="lender-head"><span class="lender-mark">${e(l.mark)}</span><div><h3>${e(textOf(l.name))}</h3><small>${pair(countries[l.country])} · ${l.kind==='marketplace'?t('سوق جهات تمويل','Finance marketplace'):t('جهة مدرجة في الدليل','Directory listing')}</small></div>${selectable?`<input type="checkbox" name="selected-lender" value="${e(l.id)}" aria-label="${t('اختر','Select')} ${e(textOf(l.name))}" style="margin-inline-start:auto">`:''}</div><p>${e(textOf(l.description))}</p>${match?pill(match.status==='potential'?t('توافق مع الشروط المنشورة المفحوصة','Matches checked published criteria'):t('الشروط التفصيلية تحتاج تأكيدًا','Detailed criteria need confirmation'),match.status==='potential'?'green':'gold'):pill(t('معلومات عامة — الشراكة غير مفعّلة','Public information — no active partnership'),'blue')}<div class="lender-actions"><button class="text-button" data-action="provider-details" data-id="${e(l.id)}">${t('المعايير والمصدر','Criteria & source')}</button><a class="text-button" href="${e(l.url)}" target="_blank" rel="noopener noreferrer">${t('الموقع الرسمي','Official website')} ↗</a></div></article>`;}
  function checkoutPage(){if(D.validateAssessment(S.state.assessment).length)return `<section class="panel">${empty(t('أكمل التقييم أولًا','Complete your assessment first'),t('نحتاج إجاباتك حتى نجهز تقريرًا مرتبطًا بملفك.','Your answers are needed to prepare your report.'),link(t('أكمل التقييم','Complete assessment'),'#assessment','primary'))}</section>`;const items=matching();return `${title(t('نتيجتك الأولية وتقريرك','Your preliminary results'),t('اطّلع على ما نعرفه، وما يحتاج تأكيدًا من الجهة.','See what is known and what still needs provider confirmation.'))}<div class="detail-columns"><div class="stack"><section class="panel">${panelHead(t('ملخص احتياج التمويل','Your funding needs'),productName(S.state.assessment.product))}${assessmentSummary(S.state.assessment)}</section><section class="panel">${panelHead(t('جهات متاحة للاستكشاف','Providers to explore'),t('الترشيح لا يعني موافقة ائتمانية أو وجود اتفاق شراكة.','A shortlist is not credit approval or evidence of a partnership.'))}${items.length?`<div class="stack">${items.map(m=>lenderCard(m.lender,m)).join('')}</div>`:notice(t('لا توجد مطابقة في الدليل الحالي. يمكنك تعديل البيانات أو طلب مراجعة عامة من فريق الوساطة.','No match was found in the current directory. You can edit your information or request a general review.'))}</section></div><div class="stack" style="align-self:start"><section class="panel">${tile('file','blue')}<h2 style="margin:16px 0 7px">${t('تقرير ميسر الأولي','Maysar preliminary report')}</h2><p class="muted" style="font-size:12px">${t('ملخص معلوماتك، نواقص المستندات، والجهات المحتملة مع أسباب ظهورها وروابطها الرسمية.','Your business summary, missing documents and potential providers with reasons and official links.')}</p><div class="checklist" style="margin:20px 0">${[t('نسخة محفوظة في حسابك','A saved copy in your account'),t('تنزيل مباشر بصيغة PDF','Direct PDF download'),t('إظهار مصدر الشروط وتاريخ المراجعة','Criteria source and review date')].map(x=>`<div class="checklist-item pass">${icon   function reportsPage(){return `${title(t('تقاريري','My reports'),t('نسخ محفوظة من التقييم الأولي ومصادره وقت الإصدار.','Saved snapshots of your preliminary assessment and sources.'),link(t('تقرير جديد','New report'),'#checkout','primary','plus'))}<section class="panel">${S.state.reports.length?`<div class="table-scroll"><table><thead><tr><th>${t('رقم التقرير','Report reference')}</th><th>${t('الشركة','Company')}</th><th>${t('المبلغ المطلوب','Requested amount')}</th><th>${t('تاريخ الإصدار','Issued')}</th><th></th></tr></thead><tbody>${S.state.reports.map(r=>`<tr><td><bdi>${D.reference(r.id)}</bdi><br>${pill(t('أولي','Preliminary'),'gold')}</td><td>${e(r.data.company.name||'—')}</td><td>${money(r.data.answers.amount,MaysarDomain.currency(r.data.answers.country))}</td><td>${date(r.created_at)}</td><td>${link(t('افتح التقرير','Open report'),'#report/'+r.id,'outline small')}</td></tr>`).join('')}</tbody></table></div>`:empty(t('تقاريرك تظهر هنا','Your reports will appear here'),t('أكمل التقييم الأولي وأصدر أول تقرير لملف شركتك.','Complete an assessment and generate your first report.'),link(t('ابدأ التقييم','Start assessment'),'#assessment','primary'),'file')}</section>`;}
  function reportPage(id){const r=S.state.reports.find(x=>x.id===id);if(!r)return notFound();const a=r.data.answers,c=D.completeness(r.data.company,r.data.documents,a.product);const ms=D.matches(a,r.data.providers_snapshot||providers()).filter(m=>r.data.lender_ids.includes(m.lender.id));return `${title(t('تقرير مطابقة أولي','Preliminary financing report'),t('لقطة من البيانات المدخلة وقت إصدار التقرير.','A snapshot of the information supplied when this report was issued.'),`<div class="actions">${button(t('تنزيل PDF','Download PDF'),'download-report','primary',`data-id="${e(r.id)}"`,'file')}${button(t('طلب مراجعة','Request review'),'application-modal','outline','','briefcase')}</div>`)}<article class="panel" id="report-document"><header class="report-cover"><div>${brand(true)}<div class="report-label">${t('تقرير تجهيز ومطابقة أولية','BUSINESS READINESS & PRELIMINARY MATCHING')}</div><h2>${e(r.data.company.name||t('ملف الشركة','Company profile'))}</h2><p>${productName(a.product)} · ${pair(countries[a.country])} · ${date(r.created_at,true)}</p></div><div><div class="report-number"><bdi>${D.reference(r.id)}</bdi></div><div style="margin-top:12px">${pill(t('تقييم أولي — ليس موافقة تمويل','Preliminary — not credit approval'),'gold')}</div></div></header><div class="report-block">${notice(t('المعلومات مبنية على إدخالك والشروط المتاحة في الدليل. اكتمال الملف لا يحدد احتمالية قبول التمويل. لم تُجرَ دراسة ائتمانية مستقلة.','This report uses your information and available directory criteria. Profile completeness is not an approval probability. No independent credit assessment has been performed.'),'blue')}</div><div class="report-block grid-2"><section><h3>${t('١. بيانات الطلب','1. Application summary')}</h3>${assessmentSummary(a)}</section><section><h3>${t('٢. تجهيز الملف','2. Profile preparation')}</h3><div class="summary-row"><span>${t('اكتمال البيانات والمرفقات','Information & document completeness')}</span><strong>${c.percent}%</strong></div><div class="checklist" style="margin-top:16px">${c.requirements.map(type=>{const uploaded=r.data.documents.some(d=>d.type===type&&d.status!=='rejected');return `<div class="checklist-item ${uploaded?'pass':'unknown'}">${icon(uploaded?'check':'folder')}<span>${pair(docNames[type])} — ${uploaded?t('مرفوع، يحتاج مراجعة المحتوى','Uploaded; content review pending'):t('مطلوب استكماله','Still needed')}</span></div>`;}).join('')}</div><div class="report-block"><h3>${t('الخطوة المقترحة','Suggested next step')}</h3><p class="muted" style="font-size:12px">${c.missing.length?t('ابدأ بالمستندات الناقصة، ثم اطلب مراجعة المعلومات والشروط مع فريق الوساطة.','Add missing documents, then request a review of your information and provider criteria.'):t('اطلب مراجعة الملف، وتأكيد أهلية المنشأة وتوفر المنتج لدى الجهة المناسبة.','Request a file review and confirmation of business eligibility and product availability.')}</p></div></section></div><section class="report-block"><h3>${t('٣. قنوات التمويل للاستكشاف','3. Financing routes to explore')}</h3>${ms.length?`<div class="grid-2">${ms.map(m=>`<div class="lender-card">${lenderCard(m.lender,m).replace('<article class="lender-card">','<div>').replace('</article>','</div>')}<div class="checklist">${m.checks.map(check=>`<div class="checklist-item ${check.result===true?'pass':check.result===null?'unknown':'fail'}">${icon(check.result===true?'check':'info')}<span>${criteriaText(check)}</span></div>`).join('')}</div><p class="readonly-note">${t('آخر مراجعة للمصدر','Source last reviewed')}: ${date(m.lender.reviewed)}</p></div>`).join('')}</div>`:notice(t('لا توجد جهة مطابقة في الدليل الحالي. هذا لا يثبت عدم إمكانية التمويل خارج نطاق الدليل.','No provider matches the current directory criteria. Other funding options may exist outside this directory.'))}</section><p class="readonly-note">${t('التقرير إرشادي ومبني على بيانات غير مدققة. تُراجع الشروط والتكاليف مع الممول قبل اتخاذ القرار.','This report is indicative and uses unverified input. Confirm terms and costs with the provider before deciding.')}</p></article>`;}
  function criteriaText(c){

    return c.result===null?t('حدود المبلغ: تحتاج تأكيدًا','Amount limits: need confirmation'):t('المبلغ ضمن الحدود المنشورة المفحوصة','Amount is within the checked published limits');
  }

  function requestPage(id,admin=false){const a=S.state.applications.find(x=>x.id===id);if(!a)return notFound();const events=S.state.events.filter(x=>x.application_id===id),offers=S.state.offers.filter(o=>o.application_id===id),messages=S.state.messages.filter(m=>m.application_id===id);const docs=S.state.documents.filter(d=>d.user_id===a.user_id);return `${title(productName(a.product),D.reference(a.id)+' · '+date(a.created_at),`${admin?button(t('تحديث الحالة','Update status'),'status-modal','primary',`data-id="${e(id)}"`,'check'):''}${link(t('المراسلات','Messages'),'#messages/'+id,'outline','headset')}`)}<div class="detail-columns"><div class="stack"><section class="panel">${panelHead(t('ملخص الطلب','Application details'),e(a.company_snapshot?.name||'—'),pill(statusName(a.status),statusTone(a.status),true))}${assessmentSummary(a.answers)}<div class="readonly-note">${t('هذه لقطة لبيانات التقديم. تحديث ملف الشركة لا يغيّر الطلب الأصلي تلقائيًا.','This is the submitted snapshot. Updating your company profile does not silently change this application.')}</div></section><section class="panel">${panelHead(t('العروض المرتبطة','Related offers'),t('عروض يضيفها فريق الوساطة إلى هذا الطلب.','Offers attached to this application by the brokerage team.'),admin?button(t('أضف عرضًا','Add offer'),'offer-modal','outline small',`data-id="${e(id)}"`,'plus'):'')}${offers.length?offers.map(o=>`<div class="quick-row">${tile('layers')}<div><strong>${e(o.provider_name)}</strong><small>${o.demo?t('عرض تجريبي','Sample offer'):t('عرض مدخل من الفريق','Team-recorded offer')}</small></div><div class="last"><strong>${money(o.amount,a.currency)}</strong><small>${number(o.months)} ${t('شهرًا','months')}</small></div></div>`).join(''):empty(t('لم يرد عرض بعد','No offer recorded yet'),t('سيظهر أي عرض فعلي يضيفه الفريق هنا.','Any offer recorded by the team will appear here.'),'','layers')}${offers.length?link(t('افتح المقارنة','Compare offers'),'#offers/'+id,'outline small'):''}</section><section class=   function messagesPage(id){const selected=S.state.applications.find(a=>a.id===id)||S.state.applications[0];if(!selected)return `${title(t('الرسائل','Messages'),t('كل محادثة مرتبطة بطلب محدد.','Each conversation belongs to an application.'))}<section class="panel">${empty(t('ابدأ طلبًا لفتح المحادثة','Start an application to open a conversation'),t('بعد إنشاء طلبك، تقدر تتواصل مع الفريق من هنا.','Once your application exists, you can contact the team here.'),link(t('ابدأ التقييم','Start assessment'),'#assessment','primary'),'headset')}</section>`;const messages=S.state.messages.filter(m=>m.application_id===selected.id);const myRole=adminMode&&staff()?'staff':'client';return `${title(t('مركز الرسائل','Message centre'),t('الاستفسارات والتوضيحات مرتبطة بملف الطلب.','Questions and context, attached to your application.'))}<section class="panel chat-panel"><div class="chat-heading"><div><h3>${e(selected.company_snapshot?.name||productName(selected.product))}</h3><small class="muted">${D.reference(selected.id)} · ${statusName(selected.status)}</small></div><select id="message-application" aria-label="${t('اختر الطلب','Choose application')}" style="width:auto;max-width:200px">${S.state.applications.map(a=>`<option value="${a.id}" ${a.id===selected.id?'selected':''}>${D.reference(a.id)}</option>`).join('')}</select></div><div class="chat-messages" id="chat-messages">${messages.length?messages.map(m=>`<div class="chat-bubble ${(m.sender_role==='client'&&myRole==='client'||m.sender_role!=='client'&&myRole==='staff')?'mine':''}"><strong style="font-size:10px">${m.sender_role==='client'?t('العميل','Client'):t('فريق الوساطة','Broker team')}</strong><div>${e(m.body)}</div><small>${date(m.created_at)}</small></div>`).join(''):empty(t('ابدأ المحادثة','Start the conversation'),t('اكتب استفسارك أو أضف توضيحًا عن الطلب. الرد يظهر عندما يكتبه الطرف الآخر.','Ask a question or add context. Replies appear when the other party sends them.'),'','headset')}</div><form id="message-form" class   function offersPage(id){const a=S.state.applications.find(x=>x.id===id)||S.state.applications.find(x=>S.state.offers.some(o=>o.application_id===x.id));const available=a?S.state.offers.filter(o=>o.application_id===a.id):[];if(!available.length)return `${title(t('العروض والمقارنة','Offers & comparison'),t('قارن تفاصيل العروض التي يضيفها فريق الوساطة لطلباتك.','Compare offers recorded by the brokerage team.'))}<section class="panel">${empty(t('عروض التمويل تظهر هنا عند ورودها','Offers appear here when recorded'),t('لن يتم إنشاء عرض باسم جهة حقيقية تلقائيًا. يمكنك تجربة إضافة عرض من لوحة الوساطة.','No offer is automatically invented under a real provider’s name. Test offers can be added in the broker workspace.'),staff()?link(t('افتح إدارة الطلبات','Open application management'),'#admin-cases','outline'):'','layers')}</section>`;if(!compareIds.some(id=>available.some(o=>o.id===id)))compareIds=available.slice(0,3).map(o=>o.id);const selected=D.compareOffers(available.filter(o=>compareIds.includes(o.id)).slice(0,3));const acceptance=S.state.acceptances.find(x=>x.application_id===a.id);const rows=[[t('المبلغ الإجمالي','Gross amount'),o=>money(o.amount,a.currency)],[t('رسوم مقدمة خارج الأقساط','Upfront fees outside instalments'),o=>money(o.fees,a.currency)],[t('صافي المستلم بعد الرسوم','Net disbursed after fees'),o=>money(o.net,a.currency)],[t('القسط الشهري','Monthly instalment'),o=>money(o.monthly_payment,a.currency)],[t('مدة السداد','Repayment period'),o=>number(o.months)+' '+t('شهر','months')],[t('إجمالي السداد والرسوم','Total repayments & fees'),o=>money(o.total,a.currency)],[t('الضمانات المطلوبة','Required security'),o=>e(o.security||t('لم تُحدد','Not specified'))],[t('صلاحية العرض','Offer valid until'),o=>o.valid_until?date(o.valid_until):t('لم تُحدد','Not specified')]];return `${title(t('قارن الخيارات بوضوح','Compare your options'),D.reference(a.id)+' · '+productName(a.product))}${S.state.offers.some(o=>o.demo)?notice(t('العروض المعلّمة «تجريبي» أُضيفت لاستعراض التطبيق، وليست عروض تمويل حقيقية.','Offers marked “sample” are for product testing, not actual financing offers.')):''}<div class="panel" style="margin-top:18px">${panelHead(t('اختر حتى ٣ عروض للمقارنة','Select up to 3 offers to compare'))}<div class="actions">${available.map(o=>`<label class="consent" style="margin:0;padding:9px 13px"><input type="checkbox" class="compare-select" value="${o.id}" ${compareIds.includes(o.id)?'checked':''}>${e(o.provider_name)}</label>`).join('')}</div></div><div class="panel table-scroll" style="margin-top:20px;padding:0"><div class="compare-grid" style="--offers:${selected.length}"><div class="compare-cell compare-label">${t('تفاصيل العرض','Offer details')}</div>${selected.map(o=>`<div class="compare-cell compare-head">${e(o.provider_name)}<br>${o.demo?pill(t('تجريبي','Sample'),'gold'):pill(t('مدخل من الفريق','Recorded by team'),'blue')}</div>`).join('')}${rows.map(([name,fn])=>`<div class="compare-cell compare-label">${name}</div>${selected.map(o=>`<div class="compare-cell">${fn(o)}</div>`).join('')}`).join('')}<div class="compare-cell compare-label">${t('الخطوة التالية','Next step')}</div>${selected.map(o=>`<div class="compare-cell">${acceptance?pill(acceptance.offer_id===o.id?t('تم تسجيل اختيارك','Your choice is recorded'):t('تم اختيار عرض آخر','Another offer was selected'),acceptance.offer_id===o.id?'green':''):o.valid_until&&new Date(o.valid_until+'T23:59:59+04:00')<new Date()?pill(t('انتهت الصلاحية','Expired'),'red'):button(t('اختر للمراجعة النهائية','Select for final review'),'accept-offer','primary small',`data-id="${o.id}"`)}</div>`).join('')}</div></div><p class="readonly-note">${t('الحساب يجمع الأقساط والرسوم المقدمة المدخلة. أي تكاليف أو دفعات أخرى يجب إضافتها قبل اعتماد المقارنة. اختيار عرض لا يُعد توقيعًا لعقد التمويل.','The comparison adds the entered instalments and separate upfront fees. Include any other costs or payments before relying on it. Selecting an offer does not sign a financing contract.')}</p>`;}
  function directoryResults(){const list=providers().filter(l=>(filter.country==='all'||l.country===filter.country)&&(filter.product==='all'||l.products.includes(filter.product))&&(!filter.text||textOf(l.name).toLowerCase().includes(filter.text.toLowerCase())));return list.length?list.map(l=>lenderCard(l)).join(''):empty(t('لا توجد نتائج بهذا الاختيار','No results for these filters'),t('جرّب تغيير الدولة أو نوع التمويل.','Try another market or funding purpose.'));}
  function directoryPage(){return `${title(t('دليل جهات ومنصات التمويل','Finance provider directory'),t('معلومات عامة ومصادر رسمية لاستكشاف المسارات.','Public information and official sources to explore your options.'))}${notice(t('الدليل لا يعني أن ميسر شريك لهذه الجهات، ولا يمثل عرضًا أو موافقة على التمويل. تاريخ مراجعة كل مصدر ظاهر في التفاصيل.','A directory listing does not imply a Maysar partnership, offer or credit approval. Each entry shows its source review date.'),'blue')}<div class="filters" style="margin-top:20px"><input id="directory-search" type="search" placeholder="${t('ابحث عن جهة…','Find a provider…')}" aria-label="${t('بحث الجهات','Search providers')}" value="${e(filter.text)}"><select id="directory-country" aria-label="${t('الدولة','Market')}"><option value="all">${t('كل الدول','All markets')}</option>${options({ae:countries.ae,sa:countries.sa},filter.country)}</select><select id="directory-product" aria-label="${t('نوع التمويل','Funding purpose')}"><option value="all">${t('كل المسارات','All purposes')}</option>${D.products.map(p=>`<option value="${p.id}" ${p.id===filter.product?'selected':''}>${t(p.ar,p.en)}</option>`).join('')}</select></div><div class="grid-3" id="directory-results">${directoryResults()}</div>`;}
  function adminPage(){const list=S.state.applications,counts=Object.fromEntries(D.statuses.map(status=>[status,list.filter(a=>a.status===status).length]));return `${title(t('مساحة فريق الوساطة','Broker workspace'),t('ملفات واضحة، متابعة منظمة، وسجل لكل إجراء.','Prepared files, organised follow-up and a history of every action.'),link(t('جميع الطلبات','All applications'),'#admin-cases','primary','briefcase'))}<div class="stats">${stat(t('قيد المراجعة','In review'),number(counts.review),t('ملفات تحتاج مراجعة الفريق','Files awaiting team review'),'briefcase','blue')}${stat(t('مطلوب استكمال','More information'),number(counts.needs_info),t('بانتظار معلومات من العميل','Waiting for client information'),'folder')}${stat(t('عروض مسجلة','Recorded offers'),number(S.state.offers.length),t('مرتبطة بطلبات فعلية في المساحة','Attached to saved applications'),'layers','green')}${stat(t('صرف مؤكد','Confirmed disbursements'),number(counts.funded),t('مع مرجع تأكيد مسجل','With a recorded confirmation reference'),'check','green')}</div><div class="dashboard-columns"><section class="panel">${panelHead(t('طلبات تحتاج انتباهك','Applications needing attention'),t('الطلبات المفتوحة مرتبة حسب تاريخ إنشائها.','Open applications, ordered by creation date.'))}${list.length?list.filter(a=>!['funded','withdrawn','declined'].includes(a.status)).slice(0,4).map(a=>requestCard(a,true)).join(''):empty(t('لا توجد طلبات مسجلة بعد','No applications recorded yet'),t('أنشئ طلبًا من واجهة العميل لتجربة المراجعة والمتابعة.','Create an application in the client workspace to test the review process.'),link(t('افتح واجهة العميل','Open client workspace'),'#dashboard','outline'),'briefcase')}</section><div class="stack"><section class="panel">${panelHead(t('توزيع حالات الطلبات','Application status distribution'))}${D.statuses.filter(status=>counts[status]>0).length?D.statuses.filter(status=>counts[status]>0).map(status=>`<div style="margin-bottom:17px"><div class="summary-row" style="border:0;padding:0 0 7px"><span>${statusName(status)}</span><strong>${number(counts[status])}</strong></div><div class="progress-line"><span style="width:${counts[status]/list.length*100}%"></span></div></div>`).join(''):`<p class="muted">${t('تظهر المؤشرات عند تسجيل أول طلب.','Metrics appear after the first application is saved.')}</p>`}</section><section class="panel">${panelHead(t('ضوابط سير العمل','Workflow controls'))}<div class="checklist">${[t('التحديث مرتبط بملاحظة واضحة للعميل.','Each status update includes a client-facing note.'),t('الإرسال للممول وتأكيد الصرف يحتاجان مرجعًا.','Submission and disbursement require a reference.'),t('العرض والاختيار والتعاقد مراحل منفصلة.','Offers, client selection and contracts are separate steps.')].map(x=>`<div class="checklist-item pass">${icon('check')}<span>${x}</span></div>`).join('')}</div></section></div></div>`;}
  function adminLendersPage(){return `${title(t('الجهات ومعايير المطابقة','Providers & matching criteria'),t('معايير قابلة للمراجعة، مع مصدر وتاريخ تحديث.','Reviewable criteria with a source and review date.'))}${notice(t('الجهات الحالية مدرجة كمعلومات عامة. تعديل المعايير لا ينشئ شراكة أو ربطًا بنظام الممول.','Current providers are public-information listings. Editing criteria does not create a partnership or a provider integration.'),'blue')}<div class="grid-3" style="margin-top:20px">${providers().map(l=>`<section class="lender-card"><div class="lender-head"><span class="lender-mark">${e(l.mark)}</span><div><h3>${e(textOf(l.name))}</h3><small>${t('آخر مراجعة','Last reviewed')}: ${date(l.reviewed)}</small></div></div><div class="summary-row"><span>${t('السوق','Market')}</span><strong>${pair(countries[l.country])}</strong></div><div class="summary-row"><span>${t('الحد الأدنى لعمر النشاط','Minimum business age')}</span><strong>${l.minMonths==null?t('غير مؤكد','Not confirmed'):number(l.minMonths)+' '+t('شهر','months')}</strong></div><div class="summary-row"><span>${t('حد الإيراد السنوي','Annual revenue threshold')}</span><strong>${l.minRevenue==null?t('غير مؤكد','Not confirmed'):money(l.minRevenue,MaysarDomain.currency(l.country))}</strong></div><div class="lender-actions">${button(t('عدّل المعايير','Edit criteria'),'edit-provider','outline small',`data-id="${e(l.id)}"`)}<a class="text-button" href="${e(l.url)}" rel="noopener noreferrer" target="_blank">${t('المصدر','Source')} ↗</a></div></section>`).join('')}</div>`;}
  function settingsPage(){return `${title(t('إعدادات الحساب','Account settings'),t('تفضيلات المساحة وإدارة الجلسة.','Workspace preferences and session settings.'))}<div class="grid-2"><section class="panel">${panelHead(t('الحساب الحالي','Current account'))}<div class="summary-row"><span>${t('الاسم','Name')}</span><strong>${e(S.state.user?.name||'—')}</strong></div><div class="summary-row"><span>${t('البريد','Email')}</span><strong dir="ltr">${e(S.state.user?.email||'—')}</strong></div><div class="summary-row"><span>${t('نوع المساحة','Workspace type')}</span><strong>${S.state.demo?t('تجربة على هذا الجهاز','Local demo'):t('حساب متصل','Connected account')}</strong></div><div class="form-actions">${S.configured&&!S.state.demo?button(t('تحديث البيانات','Refresh data'),'refresh-data','outline'):''}${button(t('تسجيل الخروج','Sign out'),'sign-out','outline')}</div></section><section class="panel">${panelHead(t('اللغة والتفضيلات','Language & preferences'))}<div class="summary-row"><span>${t('لغة الواجهة','Interface language')}</span>${button(t('التبديل للإنجليزية','Switch to Arabic'),'language','outline small')}</div><div class="summary-row"><span>${t('إصدار التطبيق','App version')}</span><strong dir="ltr">${e(window.MAYSAR_CONFIG.version)}</strong></div><div class="summary-row"><span>${t('الدفع الإلكتروني','Online payments')}</span>${pill(t('غير مفعّل','Not enabled'),'gold')}</div></section></div>${S.state.demo?`<section class="panel" style="margin-top:20px">${panelHead(t('إدارة بيانات التجربة','Demo data'),t('هذه العمليات تخص المعلومات المحفوظة على هذا الجهاز.','These actions affect data saved on this device.'))}<div class="actions">${button(t('تصدير نسخة بيانات التجربة','Export demo data'),'export-data','outline','','file')}${button(t('حذف بيانات التجربة','Delete demo data'),'reset-demo','danger','','close')}</div></section>`:''}`;}
  function authPage(){const signup=authMode==='signup';return `${publicHeader()}<main id="main-content" class="auth-wrap"><section class="auth-copy"><div class="eyebrow">${icon('sparkle')}${t('ملف واحد. خطوات أوضح.','ONE PROFILE. CLEARER STEPS.')}</div><h1>${t('مساحة أعمالك<br>تبدأ من هنا.','Your business<br>workspace starts here.')}</h1><p>${t('احفظ معلومات شركتك، جهّز مستنداتك، وتابع طلباتك في مساحة واحدة.','Save your company information, prepare documents and track applications in one workspace.')}</p><div class="checklist" style="margin-top:27px">${[t('استكمل من حيث توقفت','Resume where you left off'),t('تقرير أولي قابل للتنزيل','Downloadable preliminary report'),t('متابعة مرتبطة بكل طلب','Application-specific follow-up')].map(x=>`<div class="checklist-item pass">${icon('check')}<span>${x}</span></div>`).join('')}</div></section><section class="panel auth-panel"><h2>${signup?t('إنشاء حساب أعمال','Create a business account'):t('أهلًا بعودتك','Welcome back')}</h2><p class="muted" style="font-size:11px">${signup?t('خطوتك الأولى لتنظيم ملف التمويل.','Your first step to a prepared funding profile.'):t('سجّل الدخول للوصول إلى ملفك وطلباتك.','Sign in to access your profile and applications.')}</p><form id="auth-form"><div class="field-grid">${signup?field(t('الاسم الكامل','Full name'),'display_name','','text','required maxlength="100" class="span-2" autocomplete="name"'):''}<label class="span-2">${t('البريد الإلكتروني','Email address')}<input name="email" id="auth-email" type="email" dir="ltr" autocomplete="email" required maxlength="180" placeholder="name@company.com"></label><label class="span-2">${t('كلمة المرور','Password')}<input name="password" type="password" autocomplete="${signup?'new-password':'current-password'}" required minlength="${signup?12:1}" maxlength="128" placeholder="${signup?t('١٢ حرفًا على الأقل','At least 12 characters'):'••••••••••••'}"></label></div>${!S.configured?notice(t('التسجيل السحابي ينتظر إعداد قاعدة البيانات. يمكنك استعراض الرحلة كاملة بمساحة التجربة أدناه.','Cloud sign-in is waiting for database setup. You can explore the complete journey in the demo workspace below.'),'blue'):''}<div id="auth-error" role="alert" style="margin-top:12px"></div><button type="submit" class="button primary full" style="margin-top:18px" ${!S.configured?'disabled':''}>${signup?t('أنشئ الحساب','Create account'):t('سجّل الدخول','Sign in')}</button></form><div class="actions" style="justify-content:space-between;margin-top:15px"><button class="text-button" data-action="auth-mode">${signup?t('لدي حساب بالفعل','I already have an account'):t('إنشاء حساب جديد','Create an account')}</button>${S.configured?button(t('نسيت كلمة المرور','Forgot password'),'forgot-password','soft small'):''}</div><div class="auth-divider">${t('أو استكشف النسخة الحالية','OR EXPLORE THIS VERSION')}</div>${button(t('افتح مساحة التجربة','Open demo workspace'),'demo','outline full','','corner')}<p class="form-note" style="text-align:center;margin-top:15px">${t('التجربة لا تتطلب كلمة مرور أو دفعًا.','The demo requires no password or payment.')}</p></section></main>${publicFooter()}`;}
  function legalPage(){const privacy=route.page==='privacy';return `${title(privacy?t('خصوصية النسخة الحالية','Privacy in this version'):t('شروط استخدام النسخة الحالية','Terms for this version'))}<article class="panel legal"><h2>${t('نطاق الخدمة','Service scope')}</h2><p>${t('ميسر مساحة لتجهيز معلومات طلب التمويل ومراجعته وتتبع مراحله. التقييم الأولي والتقرير لا يمثلان موافقة ائتمانية أو التزامًا من جهة تمويل.','Maysar helps prepare, review and track financing applications. The preliminary assessment and report are not a credit approval or financing commitment.')}</p><h2>${t('بيانات التجربة','Demo data')}</h2><p>${t('في وضع التجربة تُحفظ البيانات والمرفقات محليًا داخل المتصفح على هذا الجهاز. لا يحدث إرسال خارجي للطلبات أو المستندات، ولا يتم تحصيل أموال. استخدم معلومات تجريبية. يمكنك حذف بيانات التجربة من الإعدادات.','In demo mode, data and attachments are stored in this device’s browser. Applications and files are not sent externally and no money is collected. Use sample information. Demo data can be deleted in settings.')}</p><h2>${t('الحسابات المتصلة','Connected accounts')}</h2><p>${t('عند تفعيل الخدمة السحابية، تُربط ملفات الشركة والمستندات بالمستخدم المسجل، وتُقيّد صلاحيات الاطلاع بحسب الدور. أي مشاركة للطلب مع جهة خارجية ترتبط بالموافقة المسجلة للجهات المحددة.','Once cloud services are configured, company information and documents belong to the signed-in user and access is restricted by role. External sharing is tied to recorded consent for selected providers.')}</p><h2>${t('المعلومات والقرارات','Information and decisions')}</h2><p>${t('أكّد صحة البيانات والشروط والتكاليف مع الجهة الممولة. روابط الدليل للتعريف والاستكشاف ولا تعني وجود شراكة. لا تستقبل هذه النسخة ودائع استثمار أو مبالغ صرف تمويل.','Confirm information, eligibility, terms and costs with the provider. Directory links are informational and do not imply a partnership. This version does not accept investment deposits or financing proceeds.')}</p></article>`;}
  function notFound(){return `<section class="panel">${empty(t('هذا الملف غير موجود في مساحتك','This record is not in your workspace'),t('قد تكون الصفحة غير متاحة لهذا الحساب. ارجع إلى طلباتك.','This record may not be available to your account. Return to your applications.'),link(t('طلباتي','My applications'),'#requests','primary'))}</section>`;}
  function render(focus=false){
    const next=parseRoute();if(next.page!==route.page){filter={text:'',status:'all',country:'all',product:'all'};compareIds=[];}
    route=next;menuOpen=false;document.querySelector('.overlay')?.remove();
    if(route.page.startsWith('admin'))adminMode=true;else if(!['messages','settings'].includes(route.page))adminMode=false;
    document.documentElement.lang=language();document.documentElement.dir=language()==='ar'?'rtl':'ltr';document.title=t('ميسر | مساحة أعمالك','Maysar | Your business workspace');
    document.querySelector('.skip-link').textContent=t('انتقل إلى المحتوى','Skip to content');document.querySelector('#modal [data-action="close-modal"]').setAttribute('aria-label',t('إغلاق','Close'));
    const publicRoutes=['welcome','auth','assessment','directory','privacy','terms'];
    if(!S.state.user&&!publicRoutes.includes(route.page)){history.replaceState(null,'','#auth');route={page:'auth',id:''};}
    let content;
    if(route.page.startsWith('admin')&&!staff())content=`<section class="panel">${empty(t('هذه المساحة لفريق الوساطة','This workspace is for the brokerage team'),t('حسابك الحالي لا يملك صلاحية الوصول.','Your account does not have access.'),link(t('مساحتي','My workspace'),'#dashboard','primary'))}</section>`;
    else switch(route.page){
      case 'welcome':app.innerHTML=welcomePage();return;
      case 'auth':app.innerHTML=authPage();return;
      case 'dashboard':content=dashboardPage();break;
      case 'assessment':content=assessmentPage();break;
      case 'company':content=companyPage();break;
      case 'documents':content=documentsPage();break;
      case 'checkout':content=checkoutPage();break;
      case 'reports':content=reportsPage();break;
      case 'report':content=reportPage(route.id);break;
      case 'requests':content=requestsPage();break;
      case 'request':content=requestPage(route.id);break;
      case 'messages':content=messagesPage(route.id);break;
      case 'offers':content=offersPage(route.id);break;
      case 'directory':content=directoryPage();break;
      case 'admin':content=adminPage();break;
      case 'admin-cases':content=requestsPage(true);break;
      case 'admin-case':content=requestPage(route.id,true);break;
      case 'admin-lenders':content=adminLendersPage();break;
      case 'settings':content=settingsPage();break;
      case 'privacy':case 'terms':content=legalPage();break;
      default:content=notFound();
    }
    app.innerHTML=S.state.user?shell(content):publicHeader()+`<main class="workspace" id="main-content">${content}</main>`+publicFooter();
    if(focus){window.scrollTo({top:0});document.getElementById('page-title')?.focus({preventScroll:true});}

  document.addEventListener('dragleave',event=>event.target.closest('#upload-zone')?.classList.remove('dragging'));
  document.addEventListener('drop',async event=>{const zone=event.target.closest('#upload-zone');if(!zone)return;event.preventDefault();zone.classList.remove('dragging');await uploadFiles([...event.dataTransfer.files]);});
  document.addEventListener('keydown',event=>{if(event.target.id==='upload-zone'&&['Enter',' '].includes(event.key)){event.preventDefault();document.getElementById('file-input').click();}});
  document.addEventListener('submit',async event=>{
    event.preventDefault();const form=event.target;if(busy||!form.reportValidity())return;busy=true;const submit=form.querySelector('[type=submit]');if(submit)submit.disabled=true;const data=Object.fromEntries(new FormData(form));
    try{
      switch(form.id){
        case 'auth-form':if(authMode==='signup'){const result=await S.signUp(data.email.trim(),data.password,data.display_name.trim());if(result.access_token){go(S.state.assessment.completed?'checkout':'dashboard');}else document.getElementById('auth-error').innerHTML=notice(t('راجع بريدك لتأكيد الحساب قبل تسجيل الدخول.','Check your email to confirm your account before signing in.'),'green');}else{await S.signIn(data.email.trim(),data.password);go('dashboard');}break;
        case 'company-form':{data.name=data.name.trim();data.email=data.email.trim();if(data.license_expiry&&data.license_expiry<new Date().toISOString().slice(0,10)){toast(t('تاريخ الرخصة منتهٍ. سيحتاج الملف تحديثًا قبل الإرسال.','The licence has expired; update it before provider submission.'));}await S.updateCompany(data);toast(t('تم حفظ ملف الشركة.','Company profile saved.'));render();break;}
        case 'application-form':{const lenders=[...form.querySelectorAll('[name=selected-lender]:checked')].map(el=>el.value);const a=await S.submit(lenders,Boolean(data.consent));modal.close();go('request/'+a.id);toast(t('تم إنشاء طلب مراجعة داخلية.','Internal review request created.'));break;}
        case 'message-form':{const body=data.body.trim();if(!body)break;await S.addMessage(form.dataset.id,body,adminMode&&staff()?'advisor':'client');render();break;}
        case 'status-form':if(!staff())break;await S.updateStatus(form.dataset.id,data.status,data.note,data.reference);modal.close();render();toast(t('تم تحديث حالة الطلب.','Application status updated.'));break;
        case 'offer-form':{if(!staff())break;const a=S.state.applications.find(a=>a.id===form.dataset.id);if(!a)break;const offer={application_id:a.id,provider_name:data.provider_name.trim(),amount:Number(data.amount),months:Number(data.months),monthly_payment:Number(data.monthly_payment),fees:Number(data.fees),security:data.security.trim(),reference:data.reference.trim(),valid_until:data.valid_until||null};await S.addOffer(offer);modal.close();render();toast(t('تم تسجيل العرض.','Offer recorded.'));break;}
        case 'provider-form':{if(!staff())break;const url=new URL(data.url);if(url.protocol!=='https:')throw new Error('invalid_provider');if(data.reviewed>new Date().toISOString().slice(0,10))throw new Error('invalid_provider');const override={id:form.dataset.id,url:url.href,reviewed:data.reviewed,...Object.fromEntries(['minMonths','minRevenue','minAmount','maxAmount'].map(key=>[key,data[key]===''?null:Number(data[key])]))};if(override.minAmount!==null&&override.maxAmount!==null&&override.minAmount>override.maxAmount)throw new Error('invalid_provider');await S.saveProvider(override);modal.close();render();toast(t('تم حفظ المعايير وتاريخ المراجعة.','Criteria and review date saved.'));break;}
      }
    }catch(error){const el=form.querySelector('#auth-error')||form.querySelector('#company-error');if(el)el.innerHTML=notice(errorMessage(error),'red');else toast(errorMessage(error));}finally{busy=false;if(submit?.isConnected)submit.disabled=false;}
  });
  modal.addEventListener('click',event=>{if(event.target===modal){const rect=modal.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)modal.close();}});
  window.addEventListener('hashchange',()=>render(true));
  S.init().then(()=>render()).catch(error=>{render();toast(errorMessage(error));});
})();
</script>
</body>
</html>
